version: 2
project_name: backhaul

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: backhaul
    main: ./cmd/backhaul
    binary: backhaul
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_arm64
      - windows_amd64

# wstunnel (and Wintun on Windows) are not bundled: backhaul downloads the
# pinned release on first run and verifies its SHA-256 before use.
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
